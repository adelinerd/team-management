spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: localhost
    port: ${SMTP_PORT:1025}
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.starttls.required]": false

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false
