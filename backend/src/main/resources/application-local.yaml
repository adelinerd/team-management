spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  mail:
    host: localhost
    port: ${SMTP_PORT:1025}
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.starttls.required]": false

local:
  seed:
    enabled: ${LOCAL_SEED_ENABLED:false}
    club-name: ${LOCAL_CLUB_NAME:Local Football Club}
    club-key: ${LOCAL_CLUB_KEY:local}
    admin-email: ${LOCAL_ADMIN_EMAIL:}
    admin-password: ${LOCAL_ADMIN_PASSWORD:}

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false
