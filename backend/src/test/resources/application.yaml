spring:
  application:
    name: team-management-test
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: localhost
    port: 1025
    properties:
      "[mail.smtp.connectiontimeout]": 1000
      "[mail.smtp.timeout]": 1000
      "[mail.smtp.writetimeout]": 1000
